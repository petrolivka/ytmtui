[workspace]
members = ["crates/*"]
exclude = ["spike", "fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"

# A release binary people install, not a dev build: optimise for size and speed
# over compile time.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"   # the panic hook restores the terminal; abort would not run it
strip = "symbols"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
ratatui = "0.30"
# ffmpeg does all decoding, so rodio needs playback only. `tracing` is not
# optional: without it rodio eprintln!s straight over the TUI.
rodio = { version = "0.22", default-features = false, features = ["playback", "tracing"] }
realfft = "3"
ringbuf = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
sha1 = "0.10"
hex = "0.4"
tracing = "0.1"
libc = "0.2"

[package]
name = "ytmtui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A YouTube Music client for the terminal, with a live audio spectrum"
repository = "https://github.com/petrolivka/ytmtui"
readme = "README.md"
keywords = ["music", "terminal", "tui", "youtube", "player"]
categories = ["command-line-utilities", "multimedia::audio"]

# cargo-binstall: fetch a prebuilt binary from a release instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

# Only ytmtui is installed. The rest are development tools with deliberately
# generic names - `probe`, `tune` - which have no business landing in a user's
# PATH, so they are gated behind a feature that `cargo install` does not enable.
[features]
default = []
dev-tools = []

[[bin]]
name = "ytmtui"
path = "src/main.rs"

[[bin]]
name = "tune"
path = "src/bin/tune.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dump-fixtures"
path = "src/bin/dump-fixtures.rs"
required-features = ["dev-tools"]

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
required-features = ["dev-tools"]

[[bin]]
name = "authcheck"
path = "src/bin/authcheck.rs"
required-features = ["dev-tools"]

[dependencies]
ytm-core = { path = "crates/ytm-core" }
ytm-viz = { path = "crates/ytm-viz" }
ytm-api = { path = "crates/ytm-api" }
ytm-player = { path = "crates/ytm-player" }
ytm-tui = { path = "crates/ytm-tui" }
anyhow.workspace = true
serde_json.workspace = true
ytm-config = { path = "crates/ytm-config" }
ytm-art = { path = "crates/ytm-art" }
rodio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
