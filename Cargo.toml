[workspace]
members = ["crates/*"]
exclude = ["spike"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
ratatui = "0.30"
# ffmpeg does all decoding, so rodio needs playback only. `tracing` is not
# optional: without it rodio eprintln!s straight over the TUI.
rodio = { version = "0.22", default-features = false, features = ["playback", "tracing"] }
realfft = "3"
ringbuf = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
sha1 = "0.10"
hex = "0.4"
tracing = "0.1"

[package]
name = "ytmtui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A YouTube Music client for the terminal, with a live audio spectrum"

[[bin]]
name = "ytmtui"
path = "src/main.rs"

[[bin]]
name = "tune"
path = "src/bin/tune.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "authcheck"
path = "src/bin/authcheck.rs"

[dependencies]
ytm-core = { path = "crates/ytm-core" }
ytm-viz = { path = "crates/ytm-viz" }
ytm-api = { path = "crates/ytm-api" }
ytm-player = { path = "crates/ytm-player" }
ytm-tui = { path = "crates/ytm-tui" }
anyhow.workspace = true
