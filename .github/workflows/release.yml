name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }} --bin ytmtui

      # The archive name matches the cargo-binstall pkg-url in Cargo.toml.
      - name: Package
        run: |
          tar -czf "ytmtui-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" ytmtui
          sha256sum "ytmtui-${{ matrix.target }}.tar.gz" > "ytmtui-${{ matrix.target }}.tar.gz.sha256" \
            || shasum -a 256 "ytmtui-${{ matrix.target }}.tar.gz" > "ytmtui-${{ matrix.target }}.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ytmtui-${{ matrix.target }}.tar.gz
            ytmtui-${{ matrix.target }}.tar.gz.sha256
