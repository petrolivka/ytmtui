name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }} / ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
        include:
          # The declared MSRV. A bump should be deliberate, so this job
          # builds against it explicitly.
          - os: ubuntu-latest
            rust: "1.88"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio and D-Bus headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      # rust-toolchain.toml would otherwise override the toolchain installed
      # below, so the MSRV job would silently build on stable and pass for the
      # wrong reason.
      - name: Drop the toolchain pin when testing a specific version
        if: matrix.rust != 'stable'
        run: rm -f rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --all-targets

      # The fixture and robustness suites need no network and no audio device,
      # which is the point of capturing fixtures in the first place.
      - name: Test
        run: cargo test --workspace

  # Nothing here talks to YouTube: a red CI must mean our code broke, not that
  # an undocumented API changed overnight.
  offline-guarantee:
    name: tests do not reach the network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the parser suites with networking disabled
        run: |
          # Compile first; fetching crates genuinely does need the network.
          # Then run the built binaries directly, so cargo itself never has to
          # work inside the namespace.
          cargo test -p ytm-api --test fixtures --test robustness --no-run
          bins=$(cargo test -p ytm-api --test fixtures --test robustness --no-run \
                   --message-format=json \
                 | jq -r 'select(.profile.test == true) | .executable | select(. != null)')
          test -n "$bins" || { echo "no test binaries found"; exit 1; }
          for b in $bins; do
            echo "::group::$(basename "$b") with no network"
            # sudo, not `unshare -r`: GitHub runners forbid unprivileged user
            # namespaces (uid_map is not writable), so the namespace has to be
            # created with real privileges.
            sudo unshare -n "$b"
            echo "::endgroup::"
          done
